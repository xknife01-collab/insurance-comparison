<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>보장비교분석 서비스</title>
    <meta name="description" content="제휴된 주요 보험사의 공시 요율을 바탕으로 맞춤형 보장 분석 및 비교 리포트를 제공합니다." />
    <meta property="og:title" content="보장비교분석 서비스" />
    <meta property="og:description" content="제휴된 주요 보험사의 공시 요율을 바탕으로 맞춤형 보장 분석 및 비교 리포트를 제공합니다." />

    <!-- PWA settings & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/user-icon-192.png" />
    <link rel="shortcut icon" type="image/png" href="/user-icon-192.png" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/user-icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully:', reg.scope))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
